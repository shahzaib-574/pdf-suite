<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12110e" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ream" />
    <meta
      name="description"
      content="Ream - PDF Suite. On-device PDF tools. Your files stay here."
    />
    <title>Ream - PDF Suite</title>
    <script>
      try {
        var t = localStorage.getItem('pdf.theme');
        document.documentElement.setAttribute(
          'data-theme',
          t === 'light' ? 'light' : 'dark',
        );
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('reduced-motion');
        document.documentElement.setAttribute('data-reduced-motion', 'true');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
