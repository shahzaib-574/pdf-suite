name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install exact dependencies
        run: npm ci

      - name: Verify web application
        run: |
          npm run lint
          npm run build
          npm run docx-selfcheck
          npm run pdf-selfcheck

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify generated Android plugin files are current
        run: git diff --exit-code -- android/app/capacitor.build.gradle android/capacitor.settings.gradle

      - name: Verify Android debug and optimized release builds
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew -PallowUnsignedRelease=true --no-daemon lintDebug testDebugUnitTest assembleDebug assembleRelease bundleRelease

      - name: Verify release APK 16 KB page alignment
        working-directory: android
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$apk"
          zipalign_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign -print | sort -V | tail -n 1)"
          test -n "$zipalign_path"
          "$zipalign_path" -c -P 16 -v 4 "$apk"
