import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
def allowUnsignedRelease = project.findProperty('allowUnsignedRelease')?.toString()?.toBoolean() ?: false
def releaseMetadataFile = file('src/main/assets/public/release-metadata.json')
def webAssetDirectory = file('src/main/assets/public')

if (allowUnsignedRelease && System.getenv('CI')?.toBoolean() != true) {
    throw new GradleException(
        '-PallowUnsignedRelease=true is reserved for CI verification builds. ' +
        'Configure production signing values for local release builds.'
    )
}

if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }

    def requiredSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    def missingSigningProperties = requiredSigningProperties.findAll {
        !keystoreProperties.getProperty(it)?.trim()
    }
    if (!missingSigningProperties.isEmpty()) {
        throw new GradleException("keystore.properties is missing: ${missingSigningProperties.join(', ')}")
    }

    def configuredStoreFile = rootProject.file(keystoreProperties.getProperty('storeFile'))
    if (!configuredStoreFile.isFile()) {
        throw new GradleException("Release keystore does not exist: ${configuredStoreFile}")
    }
}

def validateProductionRelease = tasks.register('validateProductionRelease') {
    group = 'verification'
    description = 'Validates signing and ad-free production assets before any release build.'

    doLast {
        // The bypass always produces unsigned artifacts and is reserved for CI's build checks.
        if (allowUnsignedRelease) {
            logger.lifecycle('Skipping production credentials check for the unsigned CI release build.')
            return
        }

        if (!hasReleaseKeystore) {
            throw new GradleException(
                'Release signing is not configured. Copy keystore.properties.example to ' +
                'keystore.properties and provide the private upload-keystore values.'
            )
        }
        if (!releaseMetadataFile.isFile()) {
            throw new GradleException(
                'Production web metadata is missing. Run ' +
                '`npm run android:sync` before building a release.'
            )
        }

        def releaseMetadata
        try {
            releaseMetadata = new JsonSlurper().parseText(releaseMetadataFile.getText('UTF-8'))
        } catch (Exception exception) {
            throw new GradleException(
                "Production web metadata is invalid: ${releaseMetadataFile}",
                exception
            )
        }

        if (releaseMetadata?.schemaVersion != 3 || releaseMetadata?.mode != 'production' || releaseMetadata?.advertising != false) {
            throw new GradleException('Expected ad-free production web assets. Run `npm run android:sync` before building.')
        }
        def forbidden = ['ca-app-pub-', '@capacitor-community/admob', 'com.google.android.gms.ads']
        if (fileTree(webAssetDirectory) { include '**/*.js' }.files.any { asset ->
            def source = asset.getText('UTF-8')
            forbidden.any { source.contains(it) }
        }) {
            throw new GradleException('Advertising code remains in synchronized web assets.')
        }
    }
}

android {
    namespace = "com.reampdf.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.reampdf.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.appVersionCode
        versionName rootProject.ext.appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore && !allowUnsignedRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// Every Android release-producing task passes through preReleaseBuild, including
// direct/internal task invocation. This avoids task-name based validation gaps.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn(validateProductionRelease)
}

apply from: 'capacitor.build.gradle'
