import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
def allowUnsignedRelease = project.findProperty('allowUnsignedRelease')?.toString()?.toBoolean() ?: false
def captureStoreScreenshots = project.findProperty('captureStoreScreenshots')?.toString()?.toBoolean() ?: false
def releaseMetadataFile = file('src/main/assets/public/release-metadata.json')
def webAssetDirectory = file('src/main/assets/public')
def monetizationConfigFile = rootProject.file('../monetization.config.json')

if (allowUnsignedRelease && System.getenv('CI')?.toBoolean() != true) {
    throw new GradleException(
        '-PallowUnsignedRelease=true is reserved for CI verification builds. ' +
        'Configure production signing values for local release builds.'
    )
}

if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }

    def requiredSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
    def missingSigningProperties = requiredSigningProperties.findAll {
        !keystoreProperties.getProperty(it)?.trim()
    }
    if (!missingSigningProperties.isEmpty()) {
        throw new GradleException("keystore.properties is missing: ${missingSigningProperties.join(', ')}")
    }

    def configuredStoreFile = rootProject.file(keystoreProperties.getProperty('storeFile'))
    if (!configuredStoreFile.isFile()) {
        throw new GradleException("Release keystore does not exist: ${configuredStoreFile}")
    }
}

def validateProductionRelease = tasks.register('validateProductionRelease') {
    group = 'verification'
    description = 'Validates signing and production AdMob assets before any release build.'

    doLast {
        // The bypass always produces unsigned artifacts and is reserved for CI's build checks.
        if (allowUnsignedRelease) {
            logger.lifecycle('Skipping production credentials check for the unsigned CI release build.')
        } else if (!hasReleaseKeystore) {
            throw new GradleException(
                'Release signing is not configured. Copy keystore.properties.example to ' +
                'keystore.properties and provide the private upload-keystore values.'
            )
        }
        if (!releaseMetadataFile.isFile()) {
            throw new GradleException(
                'Production web metadata is missing. Run ' +
                '`npm run android:sync` before building a release.'
            )
        }

        def releaseMetadata
        try {
            releaseMetadata = new JsonSlurper().parseText(releaseMetadataFile.getText('UTF-8'))
        } catch (Exception exception) {
            throw new GradleException(
                "Production web metadata is invalid: ${releaseMetadataFile}",
                exception
            )
        }

        def expectedMode = captureStoreScreenshots ? 'android-debug' : 'production'
        if (releaseMetadata?.schemaVersion != 4 ||
            releaseMetadata?.mode != expectedMode ||
            releaseMetadata?.advertising != true ||
            releaseMetadata?.ads?.provider != 'google-admob' ||
            releaseMetadata?.ads?.isTesting != captureStoreScreenshots ||
            releaseMetadata?.ads?.consent != 'google-ump' ||
            releaseMetadata?.ads?.maxAdContentRating != 'G' ||
            releaseMetadata?.ads?.tagForUnderAgeOfConsent != true ||
            releaseMetadata?.ads?.debugGeography != (captureStoreScreenshots ? 'OTHER' : null)) {
            throw new GradleException(captureStoreScreenshots
                ? 'Screenshot capture requires android-debug Google test-ad assets. Run `npm run android:sync:debug` first.'
                : 'Expected production AdMob/UMP web assets. Run `npm run android:sync` before building.')
        }

        if (!monetizationConfigFile.isFile()) {
            throw new GradleException('monetization.config.json is missing.')
        }
        def monetization = new JsonSlurper().parseText(monetizationConfigFile.getText('UTF-8'))
        def expectedBannerId = captureStoreScreenshots ? 'ca-app-pub-3940256099942544/9214589741' : monetization?.admobBannerUnitId
        if (monetization?.liveAdsEnabled != true ||
            !(monetization?.admobAppId ==~ /ca-app-pub-\d{16}~\d{10}/) ||
            !(monetization?.admobBannerUnitId ==~ /ca-app-pub-\d{16}\/\d{10}/) ||
            monetization.admobAppId.contains('3940256099942544') ||
            monetization.admobBannerUnitId.contains('3940256099942544')) {
            throw new GradleException('Production AdMob configuration is missing, malformed, disabled, or uses a sample ID.')
        }
        if (releaseMetadata.ads.appId != monetization.admobAppId ||
            releaseMetadata.ads.bannerId != expectedBannerId) {
            throw new GradleException(captureStoreScreenshots
                ? 'Screenshot capture assets must use the configured app ID and Google test banner ID.'
                : 'Synchronized production IDs do not match monetization.config.json.')
        }
        def webSource = fileTree(webAssetDirectory) { include '**/*.js', '**/*.json' }.files.collect {
            it.getText('UTF-8')
        }.join('\n')
        if (captureStoreScreenshots) {
            if (!webSource.contains(expectedBannerId) || webSource.contains(monetization.admobBannerUnitId)) {
                throw new GradleException('Screenshot capture web assets must contain only Google test banner configuration.')
            }
        } else if (!webSource.contains(monetization.admobBannerUnitId) ||
                   webSource.contains('ca-app-pub-3940256099942544/9214589741') ||
                   webSource.contains('VITE_UMP_DEBUG_GEOGRAPHY')) {
            throw new GradleException('Production web assets contain missing/mismatched IDs or Android debug ad settings.')
        }
    }
}

android {
    buildFeatures { buildConfig true }
    // Store screenshot automation must use the android-debug web bundle so it
    // can only request Google's test banner and debug UMP configuration.
    testBuildType captureStoreScreenshots ? 'release' : 'debug'
    sourceSets { androidTest.assets.srcDir '../../store-assets/fixtures' }
    if (captureStoreScreenshots) {
        sourceSets.androidTest.java.setIncludes(['**/StoreScreenshotInstrumentation.java'])
    }
    namespace = "com.reampdf.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Local test-ad proof only. Enabling production requires separate physical acceptance.
        buildConfigField 'boolean', 'TOOLS_INLINE_BANNER_PRODUCTION_VERIFIED', 'false'
        applicationId "com.reampdf.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.appVersionCode
        versionName rootProject.ext.appVersionName
        testInstrumentationRunner project.hasProperty('captureStoreScreenshots') ? 'com.reampdf.mobile.StoreScreenshotInstrumentation' : 'androidx.test.runner.AndroidJUnitRunner'
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore && !allowUnsignedRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations.matching { it.name.endsWith('CompileClasspath') }.configureEach {
    // CameraX exposes ListenableFuture from its public Java API. AdMob's graph
    // otherwise selects Guava's intentionally empty conflict shim.
    resolutionStrategy.force 'com.google.guava:listenablefuture:1.0'
}

dependencies {
    // App-owned host uses the same pinned SDK already supplied by the community plugin.
    implementation "com.google.android.gms:play-services-ads:$playServicesAdsVersion"
    implementation "com.google.android.ump:user-messaging-platform:$userMessagingPlatformVersion"
    compileOnly 'com.google.guava:listenablefuture:1.0'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'org.opencv:opencv:4.13.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    if (!captureStoreScreenshots) {
        androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
        androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    }
    implementation project(':capacitor-cordova-android-plugins')
}

// Every Android release-producing task passes through preReleaseBuild, including
// direct/internal task invocation. This avoids task-name based validation gaps.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn(validateProductionRelease)
}

apply from: 'capacitor.build.gradle'
